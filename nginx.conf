# nginx.conf — indiraprojects_frontend
# Reverse proxy to Next.js (`next start` on 127.0.0.1:3002 per ecosystem.config.cjs)
# Usage (Ubuntu):
#   sudo cp nginx.conf /etc/nginx/sites-available/indiraprojects_frontend
#   sudo ln -s /etc/nginx/sites-available/indiraprojects_frontend /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream indiraprojects_frontend {
  server 127.0.0.1:3002;
  keepalive 64;
}

server {
  listen 80;
  server_name indiraproject.example.com;

  # Allow large uploads (CMS media passthrough if ever proxied here)
  client_max_body_size 50m;

  # ── Next.js static assets: cache aggressively ──────────────────────
  location /_next/static/ {
    proxy_pass http://indiraprojects_frontend;
    proxy_cache_valid 200 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
    proxy_pass http://indiraprojects_frontend;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
  }

  # ── Everything else → Next.js ──────────────────────────────────────
  location / {
    proxy_pass http://indiraprojects_frontend;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # ── HTTPS (after Certbot): ─────────────────────────────────────────
  # Run: sudo certbot --nginx -d indiraproject.example.com
  # Certbot will add the 443 block + redirect automatically.
}

